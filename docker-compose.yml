services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-swing_trading}
      POSTGRES_USER: ${DATABASE_USER:-swing_trading}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-swing_trading} -d ${DATABASE_NAME:-swing_trading}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  flyway:
    image: flyway/flyway:13.6.0
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-swing_trading}
      FLYWAY_USER: ${DATABASE_USER:-swing_trading}
      FLYWAY_PASSWORD: ${DATABASE_PASSWORD:-change_me}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 10
    command: migrate
    volumes:
      - ./database/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    env_file:
      - '${APP_ENV_FILE:?Set APP_ENV_FILE to an environment file outside the repository}'
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: npm run start:dev
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
